<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="578" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>What a primary-diagnosis clearance covers in digital pathology</title>
<desc>PathAI AISight Dx is FDA-cleared for primary diagnosis with two named scanners, the Hamamatsu NanoZoomer S360MD and the Leica Aperio GT 450 DX. An unlisted scanner is outside the cleared configuration and needs further regulatory work.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="600" y="62" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">Cleared means a platform with named scanners</text>
<text x="600" y="98" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">AISight Dx, FDA 510(k) clearance for primary diagnosis</text>
<rect x="40" y="225" width="280" height="120" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="180.0" y="263.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">AISight Dx</text>
<text x="180.0" y="291.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">digital pathology</text>
<text x="180.0" y="319.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">platform</text>
<line x1="322" y1="285" x2="396" y2="180" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="400" y="135" width="360" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="580.0" y="172.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Hamamatsu</text>
<text x="580.0" y="200.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">NanoZoomer S360MD</text>
<line x1="762" y1="180" x2="816" y2="180" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="820" y="135" width="340" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="990.0" y="186.3" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Cleared configuration</text>
<line x1="322" y1="285" x2="396" y2="295" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="400" y="250" width="360" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="580.0" y="287.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Leica</text>
<text x="580.0" y="315.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">Aperio GT 450 DX</text>
<line x1="762" y1="295" x2="816" y2="295" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="820" y="250" width="340" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="990.0" y="301.3" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Cleared configuration</text>
<line x1="322" y1="285" x2="396" y2="410" stroke="#ec362e" stroke-width="3" marker-end="url(#ahr)"/>
<rect x="400" y="365" width="360" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="580.0" y="402.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Unlisted</text>
<text x="580.0" y="430.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">scanner</text>
<line x1="762" y1="410" x2="816" y2="410" stroke="#ec362e" stroke-width="3" marker-end="url(#ahr)"/>
<rect x="820" y="365" width="340" height="90" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="990.0" y="416.3" font-size="21" font-weight="700" fill="#111827" text-anchor="middle">Outside the clearance</text>
<text x="600" y="520" font-size="20" font-weight="400" fill="#111827" text-anchor="middle">The scanner is treated as part of the device, so each new scanner is regulatory work</text>
</svg>
