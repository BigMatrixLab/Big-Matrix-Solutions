<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="558" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>How a medical digital twin is fed and used</title>
<desc>Wearables, MRI and CT imaging, and genomic sequencing feed a personalised patient model, which is used to test surgery virtually, predict drug reactions and monitor chronic conditions, alerting when parameters drift from the healthy baseline.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="600" y="62" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">How a medical digital twin is fed and used</text>
<text x="600" y="98" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">Data in on the left, clinical uses on the right</text>
<rect x="40" y="135" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="170.0" y="172.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Wearables</text>
<text x="170.0" y="200.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">real-time signals</text>
<line x1="302" y1="180" x2="436" y2="240" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="250" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="170.0" y="287.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Imaging</text>
<text x="170.0" y="315.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">MRI and CT</text>
<line x1="302" y1="295" x2="436" y2="290" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="365" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="170.0" y="402.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Genomics</text>
<text x="170.0" y="430.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">sequencing</text>
<line x1="302" y1="410" x2="436" y2="340" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="900" y="135" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1030.0" y="172.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Test surgery</text>
<text x="1030.0" y="200.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">on a virtual heart</text>
<line x1="762" y1="240" x2="896" y2="180" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="900" y="250" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1030.0" y="287.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Predict drug reactions</text>
<text x="1030.0" y="315.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">e.g. chemotherapy</text>
<line x1="762" y1="290" x2="896" y2="295" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="900" y="365" width="260" height="90" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1030.0" y="402.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Monitor</text>
<text x="1030.0" y="430.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">alert on deviation</text>
<line x1="762" y1="340" x2="896" y2="410" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="440" y="200" width="320" height="180" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="600.0" y="265.2" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">Patient digital twin</text>
<text x="600.0" y="297.2" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">personalised model,</text>
<text x="600.0" y="329.2" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">updated as data arrives</text>
<text x="600" y="500" font-size="20" font-weight="400" fill="#111827" text-anchor="middle">Alerts fire when the twin drifts from the patient's own healthy baseline</text>
</svg>
