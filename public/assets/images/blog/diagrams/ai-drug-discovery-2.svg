<text x="84" y="236" font-size="24" fill="#111827" text-anchor="start" font-weight="700">Target</text>
<text x="84" y="268" font-size="24" fill="#111827" text-anchor="start" font-weight="700">identification</text>
<text x="84" y="318" font-size="19" fill="#4b5563" text-anchor="start">Genuinely transformed</text>
<rect x="84" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
<rect x="136" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
