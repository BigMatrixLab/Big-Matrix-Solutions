<text x="60" y="106" font-size="20" fill="#4b5563" text-anchor="start">Qualitative assessment from the article; block counts are illustrative, not measured</text>
<rect x="60" y="150" width="255" height="250" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
