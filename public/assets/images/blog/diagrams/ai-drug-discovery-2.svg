<text x="70" y="480" font-size="20" fill="#111827" text-anchor="start" font-weight="700">AI compresses discovery and preclinical work:</text>
<text x="70" y="508" font-size="20" fill="#4b5563" text-anchor="start">months instead of years to candidate nomination</text>
<line x1="885" y1="440" x2="1130" y2="440" stroke="#4b5563" stroke-width="3"/>
<line x1="885" y1="430" x2="885" y2="450" stroke="#4b5563" stroke-width="3"/>
<line x1="1130" y1="430" x2="1130" y2="450" stroke="#4b5563" stroke-width="3"/>
<text x="885" y="480" font-size="20" fill="#111827" text-anchor="start" font-weight="700">Majority of time and cost,</text>
<text x="885" y="508" font-size="20" fill="#4b5563" text-anchor="start">gated by biology and people</text>
<text x="60" y="570" font-size="20" fill="#111827" text-anchor="start">No AI-designed drug had received FDA approval as of mid-2026.</text>
</g>
</svg>
