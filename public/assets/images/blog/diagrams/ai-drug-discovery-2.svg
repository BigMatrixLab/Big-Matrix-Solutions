<rect x="610" y="150" width="255" height="250" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="634" y="196" font-size="22" fill="#ec362e" text-anchor="start" font-weight="700">3</text>
<text x="634" y="236" font-size="24" fill="#111827" text-anchor="start" font-weight="700">Preclinical</text>
<text x="634" y="268" font-size="24" fill="#111827" text-anchor="start" font-weight="700">validation</text>
<text x="634" y="318" font-size="19" fill="#4b5563" text-anchor="start">Modestly helped</text>
<rect x="634" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
<rect x="686" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
