<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img">
<rect x="1" y="1" width="1198" height="608" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Where AI helps in drug development</title>
<desc>Target identification: genuinely transformed. Molecule design: substantially accelerated. Preclinical validation: modestly helped. Clinical trials: barely touched, yet they are the majority of time and cost.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
