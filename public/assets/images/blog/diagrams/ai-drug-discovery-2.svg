<text x="909" y="236" font-size="24" fill="#111827" text-anchor="start" font-weight="700">Clinical</text>
<text x="909" y="268" font-size="24" fill="#111827" text-anchor="start" font-weight="700">trials</text>
<text x="909" y="318" font-size="19" fill="#4b5563" text-anchor="start">Barely touched</text>
