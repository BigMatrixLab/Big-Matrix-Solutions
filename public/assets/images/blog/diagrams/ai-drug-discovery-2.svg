<text x="359" y="196" font-size="22" fill="#ec362e" text-anchor="start" font-weight="700">2</text>
<text x="359" y="236" font-size="24" fill="#111827" text-anchor="start" font-weight="700">Molecule</text>
<text x="359" y="268" font-size="24" fill="#111827" text-anchor="start" font-weight="700">design</text>
<text x="359" y="318" font-size="19" fill="#4b5563" text-anchor="start">Substantially accelerated</text>
<rect x="359" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
<rect x="411" y="346" width="44" height="22" rx="4" fill="#ec362e"/>
