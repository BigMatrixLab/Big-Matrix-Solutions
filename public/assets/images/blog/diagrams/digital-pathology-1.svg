<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img">
<rect x="1" y="1" width="1198" height="568" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>FDA-authorised AI devices: radiology versus pathology</title>
<desc>1,163 cleared radiology algorithms, 51 AI/ML devices in pathology-relevant panels, and only 7 algorithms that analyse whole-slide images.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="60" y="70" font-size="30" fill="#111827" text-anchor="start" font-weight="700">The honest scorecard: FDA-authorised AI/ML devices</text>
<text x="60" y="106" font-size="20" fill="#4b5563" text-anchor="start">Through April 2026; bar lengths to scale</text>
<text x="60" y="198" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Radiology algorithms</text>
<rect x="380" y="160" width="675" height="56" rx="3" fill="#9ca3af"/>
<text x="1071" y="198" font-size="26" fill="#111827" text-anchor="start" font-weight="700">1,163</text>
<text x="60" y="294" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Pathology-relevant panels</text>
<rect x="380" y="256" width="30" height="56" rx="3" fill="#2563eb"/>
<text x="426" y="294" font-size="26" fill="#111827" text-anchor="start" font-weight="700">51</text>
<text x="60" y="390" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Analyse whole-slide images</text>
<rect x="380" y="352" width="5" height="56" rx="3" fill="#ec362e"/>
<text x="401" y="390" font-size="26" fill="#111827" text-anchor="start" font-weight="700">7</text>
<text x="60" y="500" font-size="20" fill="#4b5563" text-anchor="start">Most of the 51 are haematology analysers and molecular devices,</text>
<text x="60" y="530" font-size="20" fill="#4b5563" text-anchor="start">not computational pathology. Seven algorithms are cleared to read a slide.</text>
</g>
</svg>
