<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 654" width="1200" height="654" role="img">
<rect x="1" y="1" width="1198" height="652" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Round-to-nearest quantization and outliers</title>
<desc>Worked example: eight weights quantized to 4-bit integers with a scale of 0.30 restore with small errors. Replacing one weight with an outlier of 8.40 raises the scale to 1.20 and four small weights round to zero.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Round-to-nearest 4-bit quantization of one group</text>
<text x="60" y="108" font-family="Consolas, Menlo, monospace" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">scale = max|w| / 7;   q = round(w / scale);   restored = q × scale</text>
<text x="60" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Normal group: scale = 2.10 / 7 = 0.30</text>
<text x="60" y="212" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">weights</text>
