<rect x="382" y="178" width="104" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="434" y="211" font-family="Consolas, Menlo, monospace" font-size="20" fill="#111827" text-anchor="middle" font-weight="400" xml:space="preserve">-1.37</text>
