<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Inter, Segoe UI, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="499" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<title>The residual stream</title>
<desc>A horizontal residual stream runs from the embedding to the final norm and output head. Each sublayer (attention, then MLP, repeated per block) reads the stream through a norm and adds its output back with a residual addition, so layers write corrections into a shared channel rather than replacing it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="600" y="48" font-size="26" fill="#111827" text-anchor="middle" font-weight="bold">The residual stream: read, compute, add back</text>
<rect x="30" y="280" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="115.0" y="313.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Embedding</text>
<text x="115.0" y="339.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">+ position</text>
<rect x="1000" y="280" width="170" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1085.0" y="313.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Final norm</text>
<text x="1085.0" y="339.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">→ vocab logits</text>
<line x1="200" y1="320" x2="998" y2="320" stroke="#ec362e" stroke-width="8"/>
<line x1="990" y1="320" x2="998" y2="320" stroke="#ec362e" stroke-width="2" marker-end="url(#ar)"/>
<rect x="260" y="140" width="140" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="330.0" y="178.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="normal">RMSNorm</text>
<text x="330.0" y="204.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Attention</text>
<line x1="290" y1="316" x2="290" y2="232" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="370" y1="230" x2="370" y2="304" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<circle cx="370" cy="320" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="370" y="327" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">+</text>
<rect x="430" y="140" width="140" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="500.0" y="178.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="normal">RMSNorm</text>
<text x="500.0" y="204.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">MLP</text>
<line x1="460" y1="316" x2="460" y2="232" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="540" y1="230" x2="540" y2="304" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<circle cx="540" cy="320" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="540" y="327" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">+</text>
<rect x="600" y="140" width="140" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="670.0" y="178.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="normal">RMSNorm</text>
<text x="670.0" y="204.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Attention</text>
<line x1="630" y1="316" x2="630" y2="232" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="710" y1="230" x2="710" y2="304" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<circle cx="710" cy="320" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="710" y="327" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">+</text>
<rect x="770" y="140" width="140" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="840.0" y="178.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="normal">RMSNorm</text>
<text x="840.0" y="204.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">MLP</text>
<line x1="800" y1="316" x2="800" y2="232" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="880" y1="230" x2="880" y2="304" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<circle cx="880" cy="320" r="14" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="880" y="327" font-size="20" fill="#111827" text-anchor="middle" font-weight="bold">+</text>
<path d="M260,372 L260,382 L570,382 L570,372" stroke="#4b5563" stroke-width="2" fill="none"/>
<text x="415.0" y="408" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Block 1</text>
<path d="M600,372 L600,382 L910,382 L910,372" stroke="#4b5563" stroke-width="2" fill="none"/>
<text x="755.0" y="408" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Block 2</text>
<text x="215" y="354" font-size="18" fill="#ec362e" text-anchor="start" font-weight="bold">residual stream</text>
<text x="600" y="455" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">x = x + attention(norm(x));  x = x + mlp(norm(x)). Each layer adds a correction; none overwrites the stream.</text>
</svg>
