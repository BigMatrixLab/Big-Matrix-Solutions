  <line x1="720.0" y1="130" x2="720.0" y2="332" stroke="#d1d5db" stroke-dasharray="4 6"/>
  <line x1="1070.0" y1="130" x2="1070.0" y2="332" stroke="#d1d5db" stroke-dasharray="4 6"/>
  <rect x="370" y="140" width="700" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="370" y="140" width="672.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="40" y="162" font-size="20" fill="#111827" text-anchor="start">MATH-500</text>
  <text x="1054.0" y="162" font-size="20" fill="#111827" text-anchor="start" font-weight="700">about 96%</text>
  <rect x="370" y="192" width="700" height="30" rx="4" fill="#f3f4f6"/>
