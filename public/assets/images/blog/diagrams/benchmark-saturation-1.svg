<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="472" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">Saturated at the top, near zero on novelty</title>
  <desc id="d">Horizontal bars: MATH-500 around 96 percent, GPQA Diamond in the mid-nineties, SWE-bench Verified tracked scores above 95 percent, and ARC-AGI-3 frontier AI systems at 0.51 percent at launch.</desc>
