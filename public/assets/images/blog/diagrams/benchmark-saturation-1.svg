  <rect x="370" y="244" width="700" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="370" y="244" width="665.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="40" y="266" font-size="20" fill="#111827" text-anchor="start">SWE-bench Verified</text>
