<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<rect x="1" y="1" width="1198" height="558" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Intelligent routing between a small model and a large model</title>
<desc>Simple queries, about 95 percent, go to the small model. Moderate queries, about 4 percent, try the small model first and escalate to the large model when confidence is below 85 percent. Complex queries, about 1 percent, go straight to the large model.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="60" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Route by difficulty, escalate on low confidence</text>
<text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">The hybrid split described in this article</text>
<rect x="60" y="250" width="180" height="80" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="150" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="middle" font-weight="700">Query</text>
<line x1="242" y1="290" x2="330" y2="180" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="345" y="174" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700">Simple</text>
<text x="345" y="202" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">~95%</text>
<line x1="242" y1="290" x2="330" y2="300" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="345" y="294" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700">Moderate</text>
<text x="345" y="322" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">~4%</text>
<line x1="242" y1="290" x2="330" y2="420" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="345" y="414" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700">Complex</text>
<text x="345" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">~1%</text>
<rect x="560" y="140" width="260" height="80" rx="10" fill="#f3f4f6" stroke="#2563eb" stroke-width="3"/>
<text x="690" y="188" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="middle" font-weight="700">Small model (SLM)</text>
<line x1="470" y1="180" x2="556" y2="180" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="560" y="260" width="260" height="80" rx="10" fill="#f3f4f6" stroke="#2563eb" stroke-width="3"/>
<text x="690" y="300" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="middle" font-weight="700">SLM first</text>
<text x="690" y="326" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="400">check confidence</text>
<line x1="470" y1="300" x2="556" y2="300" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="900" y="320" width="240" height="80" rx="10" fill="#f3f4f6" stroke="#ec362e" stroke-width="3"/>
<text x="1020" y="368" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="middle" font-weight="700">Large model</text>
<line x1="822" y1="315" x2="896" y2="345" stroke="#ec362e" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="840" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#ec362e" text-anchor="start" font-weight="700">&lt; 85%</text>
<path d="M 470 420 L 1020 420 L 1020 404" fill="none" stroke="#ec362e" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="60" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Most traffic never reaches the expensive model; escalation is the exception, not the default.</text>
</svg>
