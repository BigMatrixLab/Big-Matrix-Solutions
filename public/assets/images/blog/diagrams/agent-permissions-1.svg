<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="650" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">Six layers between a proposed tool call and a real action</title>
  <desc id="d">A proposed agent tool call passes through six controls in order: tool surface, credentials, sandbox, approval gate, downstream authorisation, and audit with rate limits.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/>
    </marker>
  </defs>
  <text x="600" y="54" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Six layers between a proposed tool call and a real action</text>

  <line x1="64" y1="96" x2="64" y2="608" stroke="#ec362e" stroke-width="4" marker-end="url(#a)"/>
  <text x="40" y="352" text-anchor="middle" font-size="18" fill="#4b5563" transform="rotate(-90 40 352)">model proposes a call</text>

  <g font-size="18" fill="#4b5563">
    <rect x="100" y="90" width="1076" height="76" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="136" font-size="22" font-weight="700" fill="#111827">1  Tool surface</text>
    <text x="440" y="135">Only the tools this task needs; read-only variants first</text>

    <rect x="100" y="176" width="1076" height="76" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="222" font-size="22" font-weight="700" fill="#111827">2  Credentials</text>
    <text x="440" y="221">Narrow scopes, short-lived, per user; no token passthrough</text>

    <rect x="100" y="262" width="1076" height="76" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="308" font-size="22" font-weight="700" fill="#111827">3  Sandbox</text>
    <text x="440" y="307">Filesystem and network allowlists enforced by the OS</text>

    <rect x="100" y="348" width="1076" height="76" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2.5"/>
    <text x="128" y="394" font-size="22" font-weight="700" fill="#111827">4  Approval gate</text>
    <text x="440" y="393">A human confirms high-impact or irreversible actions</text>

    <rect x="100" y="434" width="1076" height="76" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="480" font-size="22" font-weight="700" fill="#111827">5  Downstream authz</text>
    <text x="440" y="479">The target system enforces policy, not the model</text>

    <rect x="100" y="520" width="1076" height="76" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="566" font-size="22" font-weight="700" fill="#111827">6  Audit and limits</text>
    <text x="440" y="565">Log every call with a trace id; rate-limit; alert on anomalies</text>
  </g>
  <text x="638" y="632" text-anchor="middle" font-size="18" fill="#4b5563">Each layer assumes the one above it has already failed.</text>
</svg>
