<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img">
<rect x="1" y="1" width="1198" height="648" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Alt text decision flow</title>
<desc>Based on the W3C WAI alt decision tree. One: does the image contain text? Put that text in the alt unless it repeats nearby text. Two: is it in a link or button? Describe the destination or action. Three: does it add meaning? Give a brief description, or for a complex image a short alt plus a long description elsewhere. Four: is it purely decorative? Use empty alt. AI drafts help most in the description case, with human review.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Choosing alt text: the W3C questions</text>
<text x="60" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">Work down in order; AI can draft descriptions, a person approves them</text>
<circle cx="86" cy="175" r="24" fill="#ec362e"/>
<text x="86" y="182" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="130" y="135" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320.0" y="182.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Does it contain text?</text>
<line x1="510" y1="175" x2="558" y2="175" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="560" y="135" width="590" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="855.0" y="181.7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="400">Put that text in alt, unless it repeats nearby text</text>
<circle cx="86" cy="290" r="24" fill="#ec362e"/>
<text x="86" y="297" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="130" y="250" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320.0" y="297.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Is it a link or button?</text>
<line x1="510" y1="290" x2="558" y2="290" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="560" y="250" width="590" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="855.0" y="296.6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="400">Describe the destination or action, not the picture</text>
<circle cx="86" cy="405" r="24" fill="#ec362e"/>
<text x="86" y="412" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<rect x="130" y="365" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320.0" y="412.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Does it add meaning?</text>
<line x1="510" y1="405" x2="558" y2="405" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="560" y="365" width="590" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="855.0" y="411.6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="400">Brief description; complex chart: short alt + long text</text>
<circle cx="86" cy="520" r="24" fill="#ec362e"/>
<text x="86" y="527" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<rect x="130" y="480" width="380" height="80" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320.0" y="527.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Purely decorative?</text>
<line x1="510" y1="520" x2="558" y2="520" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="560" y="480" width="590" height="80" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="855.0" y="526.6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="middle" font-weight="400">Empty alt: alt=""</text>
<text x="560" y="615" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" text-anchor="start" font-weight="400">Blue border: where an AI draft helps most, with human review</text>
</svg>
