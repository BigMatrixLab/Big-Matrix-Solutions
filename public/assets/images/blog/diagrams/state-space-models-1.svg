<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Attention keeps every token; a state space model keeps a fixed-size state</title>
  <desc>Top: during generation, attention appends a key and value for every token to a KV cache that grows with sequence length, and each new token reads all of it. Bottom: a state space model folds each token into a fixed-size hidden state, so memory and work per token stay constant regardless of length.</desc>
  <rect x="0" y="0" width="1200" height="620" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#111827">What each architecture carries between tokens</text>

  <!-- Attention -->
  <text x="60" y="122" font-size="22" font-weight="700" fill="#111827">Attention (Transformer)</text>
  <text x="60" y="152" font-size="18" fill="#4b5563">KV cache grows by one entry per token; each new token reads all of it</text>
  <g fill="#f3f4f6" stroke="#d1d5db" stroke-width="2">
    <rect x="60" y="176" width="60" height="56" rx="6"/><rect x="128" y="176" width="60" height="56" rx="6"/><rect x="196" y="176" width="60" height="56" rx="6"/><rect x="264" y="176" width="60" height="56" rx="6"/><rect x="332" y="176" width="60" height="56" rx="6"/><rect x="400" y="176" width="60" height="56" rx="6"/><rect x="468" y="176" width="60" height="56" rx="6"/><rect x="536" y="176" width="60" height="56" rx="6"/><rect x="604" y="176" width="60" height="56" rx="6"/><rect x="672" y="176" width="60" height="56" rx="6"/>
  </g>
  <g font-size="18" fill="#111827" text-anchor="middle">
    <text x="90" y="210">t1</text><text x="158" y="210">t2</text><text x="226" y="210">t3</text><text x="294" y="210">t4</text><text x="362" y="210">t5</text><text x="430" y="210">t6</text><text x="498" y="210">t7</text><text x="566" y="210">t8</text><text x="634" y="210">t9</text><text x="702" y="210">...</text>
  </g>
  <rect x="760" y="176" width="70" height="56" rx="6" fill="#ec362e"/>
  <text x="795" y="210" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">new</text>
  <text x="860" y="200" font-size="20" fill="#111827">Memory: grows with length</text>
  <text x="860" y="228" font-size="20" fill="#111827">Prefill work: quadratic</text>

  <!-- SSM -->
  <text x="60" y="330" font-size="22" font-weight="700" fill="#111827">State space model (Mamba)</text>
  <text x="60" y="360" font-size="18" fill="#4b5563">Each token updates one fixed-size state; old tokens are not stored</text>
  <g fill="#f3f4f6" stroke="#d1d5db" stroke-width="2">
    <rect x="60" y="400" width="60" height="56" rx="6"/><rect x="200" y="400" width="60" height="56" rx="6"/><rect x="340" y="400" width="60" height="56" rx="6"/>
  </g>
  <g font-size="18" fill="#111827" text-anchor="middle">
    <text x="90" y="434">t1</text><text x="230" y="434">t2</text><text x="370" y="434">t3</text>
  </g>
  <g fill="#2563eb">
    <rect x="130" y="490" width="60" height="56" rx="6"/><rect x="270" y="490" width="60" height="56" rx="6"/><rect x="410" y="490" width="60" height="56" rx="6"/>
  </g>
  <g font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="160" y="524">h1</text><text x="300" y="524">h2</text><text x="440" y="524">h3</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="105" y1="458" x2="145" y2="488"/><line x1="245" y1="458" x2="285" y2="488"/><line x1="385" y1="458" x2="425" y2="488"/>
    <line x1="192" y1="518" x2="266" y2="518"/><line x1="332" y1="518" x2="406" y2="518"/><line x1="472" y1="518" x2="520" y2="518"/>
  </g>
  <text x="530" y="525" font-size="20" fill="#111827">...</text>
  <text x="860" y="490" font-size="20" fill="#111827">Memory: constant</text>
  <text x="860" y="518" font-size="20" fill="#111827">Work: linear in length</text>
  <text x="860" y="546" font-size="20" fill="#ec362e">Cost: lossy recall</text>
  <text x="60" y="596" font-size="18" fill="#4b5563">Mamba's selection makes the update depend on the input, so it can choose what to keep or forget.</text>
</svg>
