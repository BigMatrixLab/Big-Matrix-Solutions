<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<title>Causal attention mask</title>
<desc>A 6 by 6 attention score grid for the sentence 'The cat sat on the mat'. Cells where the key position is at or before the query position are allowed. Cells above the diagonal are future positions, set to minus infinity before the softmax so their weight becomes zero. An encoder uses no mask; a decoder uses this triangular mask.</desc>
