<text x="684" y="171" font-size="20" fill="#111827" text-anchor="start" font-weight="normal">Allowed: key at or before the query</text>
<rect x="640" y="200" width="28" height="28" fill="#f3f4f6" stroke="#d1d5db"/>
<text x="684" y="221" font-size="20" fill="#111827" text-anchor="start" font-weight="normal">Masked: a future token, set to −∞</text>
<text x="684" y="249" font-size="20" fill="#4b5563" text-anchor="start" font-weight="normal">before softmax, so its weight is 0</text>
<text x="640" y="310" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Decoder (generation)</text>
<text x="640" y="338" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">mask = triu(ones, diagonal=1)</text>
<text x="640" y="364" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">Each position sees only the past.</text>
<text x="640" y="418" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Encoder (classification)</text>
<text x="640" y="446" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">No mask: every cell is allowed,</text>
<text x="640" y="472" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">so each token sees the whole input.</text>
