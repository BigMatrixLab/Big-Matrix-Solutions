<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Static batching versus continuous batching</title>
  <desc>Two timelines of four batch slots over ten decode steps. With static batching, slots whose request finished early sit idle until the longest request ends. With continuous batching, scheduling happens every iteration, so a finished slot is refilled with a waiting request on the next step.</desc>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#111827">Static vs continuous (iteration-level) batching</text>
  <text x="60" y="94" font-size="20" fill="#4b5563">Four batch slots, one column per decode step. Letters are requests; grey is a wasted slot.</text>

  <!-- Static -->
  <text x="60" y="150" font-size="22" font-weight="700" fill="#111827">Static batching</text>
  <g font-size="18" fill="#4b5563">
    <text x="60" y="196">slot 1</text><text x="60" y="244">slot 2</text><text x="60" y="292">slot 3</text><text x="60" y="340">slot 4</text>
  </g>
  <!-- each step 80px wide starting x=160 -->
  <g stroke="#ffffff" stroke-width="3">
    <rect x="160" y="170" width="240" height="40" fill="#ec362e"/><rect x="400" y="170" width="400" height="40" fill="#d1d5db"/>
    <rect x="160" y="218" width="640" height="40" fill="#ec362e"/>
    <rect x="160" y="266" width="400" height="40" fill="#ec362e"/><rect x="560" y="266" width="240" height="40" fill="#d1d5db"/>
    <rect x="160" y="314" width="160" height="40" fill="#ec362e"/><rect x="320" y="314" width="480" height="40" fill="#d1d5db"/>
    <rect x="800" y="170" width="160" height="40" fill="#2563eb"/><rect x="800" y="218" width="160" height="40" fill="#2563eb"/><rect x="800" y="266" width="160" height="40" fill="#2563eb"/><rect x="800" y="314" width="160" height="40" fill="#2563eb"/>
  </g>
  <g font-size="20" font-weight="700" fill="#ffffff">
    <text x="180" y="197">A</text><text x="180" y="245">B</text><text x="180" y="293">C</text><text x="180" y="341">D</text>
    <text x="820" y="197">E</text><text x="820" y="245">F</text><text x="820" y="293">G</text><text x="820" y="341">H</text>
  </g>
  <text x="980" y="250" font-size="18" fill="#4b5563">New batch only</text>
  <text x="980" y="274" font-size="18" fill="#4b5563">after B finishes</text>

  <!-- Continuous -->
  <text x="60" y="420" font-size="22" font-weight="700" fill="#111827">Continuous batching</text>
  <g font-size="18" fill="#4b5563">
    <text x="60" y="466">slot 1</text><text x="60" y="514">slot 2</text><text x="60" y="562">slot 3</text><text x="60" y="610">slot 4</text>
  </g>
  <g stroke="#ffffff" stroke-width="3">
    <rect x="160" y="440" width="240" height="40" fill="#ec362e"/><rect x="400" y="440" width="400" height="40" fill="#2563eb"/>
    <rect x="160" y="488" width="640" height="40" fill="#ec362e"/>
    <rect x="160" y="536" width="400" height="40" fill="#ec362e"/><rect x="560" y="536" width="240" height="40" fill="#2563eb"/>
    <rect x="160" y="584" width="160" height="40" fill="#ec362e"/><rect x="320" y="584" width="480" height="40" fill="#2563eb"/>
  </g>
  <g font-size="20" font-weight="700" fill="#ffffff">
    <text x="180" y="467">A</text><text x="420" y="467">E</text>
    <text x="180" y="515">B</text>
    <text x="180" y="563">C</text><text x="580" y="563">G</text>
    <text x="180" y="611">D</text><text x="340" y="611">F</text>
  </g>
  <text x="840" y="512" font-size="18" fill="#4b5563">Freed slots refilled</text>
  <text x="840" y="536" font-size="18" fill="#4b5563">on the very next step</text>

  <line x1="160" y1="652" x2="960" y2="652" stroke="#d1d5db" stroke-width="2"/>
  <text x="160" y="680" font-size="18" fill="#4b5563">decode steps (time)</text>
</svg>
