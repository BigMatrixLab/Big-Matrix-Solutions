<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img">
<rect x="1" y="1" width="1198" height="518" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Results of a randomised trial of LLM-assisted trial prescreening</title>
<desc>In a randomised trial of 4,476 patients for the COPILOT-HF heart failure trial, AI-assisted prescreening identified 458 eligible patients versus 284 with manual screening, and enrolled 35 versus 19. Study staff reviewed AI-positive charts.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">AI-assisted vs manual prescreening: a randomised trial</text>
<text x="60" y="106" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">COPILOT-HF heart failure trial, 4,476 patients randomised (JAMA, 2025)</text>
<text x="60" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Patients found eligible</text>
<text x="60" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">AI-assisted</text>
<rect x="230" y="178" width="700.0" height="36" rx="6" fill="#ec362e" stroke="none" stroke-width="2"/>
<text x="940.0" y="204" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">458</text>
<text x="60" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Manual</text>
<rect x="230" y="230" width="434.06113537117903" height="36" rx="6" fill="#d1d5db" stroke="none" stroke-width="2"/>
<text x="674.061135371179" y="256" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">284</text>
<text x="60" y="320" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Patients enrolled</text>
<text x="60" y="364" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">AI-assisted</text>
<rect x="230" y="338" width="53.493449781659386" height="36" rx="6" fill="#ec362e" stroke="none" stroke-width="2"/>
<text x="293.49344978165936" y="364" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">35</text>
<text x="60" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Manual</text>
<rect x="230" y="390" width="29.03930131004367" height="36" rx="6" fill="#d1d5db" stroke="none" stroke-width="2"/>
<text x="269.0393013100437" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">19</text>
<text x="60" y="480" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Both panels share one scale. Staff still reviewed every AI-positive chart.</text>
</svg>
