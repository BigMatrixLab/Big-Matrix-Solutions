<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
<rect x="1" y="1" width="1198" height="598" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Levels of autonomy in surgical robotics</title>
<desc>Six levels from pure teleoperation (0) to full autonomy (5). Almost all clinical systems are at level 0 or 1; the Johns Hopkins gallbladder demonstration is level 2 edging toward level 3, on ex vivo tissue.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="60" y="70" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Levels of autonomy in surgical robotics</text>
<text x="60" y="106" font-size="20" fill="#4b5563" text-anchor="start">Framework borrowed from automotive; where today's systems actually sit</text>
<rect x="60" y="140" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="179" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">0</text>
<text x="124" y="168" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Pure teleoperation</text>
<text x="124" y="192" font-size="18" fill="#4b5563" text-anchor="start">every motion comes from the surgeon</text>
<rect x="60" y="212" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="251" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">1</text>
<text x="124" y="240" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Robot assistance</text>
<text x="124" y="264" font-size="18" fill="#4b5563" text-anchor="start">tremor filtering, motion scaling, virtual boundaries</text>
<rect x="60" y="284" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="323" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">2</text>
<text x="124" y="312" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Task autonomy</text>
<text x="124" y="336" font-size="18" fill="#4b5563" text-anchor="start">robot performs a discrete step under supervision</text>
<rect x="60" y="356" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="395" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">3</text>
<text x="124" y="384" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Conditional autonomy</text>
<text x="124" y="408" font-size="18" fill="#4b5563" text-anchor="start">whole procedure, surgeon monitoring</text>
<rect x="60" y="428" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="467" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">4</text>
<text x="124" y="456" font-size="21" fill="#111827" text-anchor="start" font-weight="700">High autonomy</text>
<text x="124" y="480" font-size="18" fill="#4b5563" text-anchor="start">no surgeon required for defined procedures</text>
<rect x="60" y="500" width="660" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="84" y="539" font-size="24" fill="#ec362e" text-anchor="start" font-weight="700">5</text>
<text x="124" y="528" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Full autonomy</text>
<rect x="744" y="140" width="8" height="132" rx="4" fill="#2563eb"/>
<text x="772" y="182" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Almost every clinical system</text>
<text x="772" y="210" font-size="19" fill="#4b5563" text-anchor="start">da Vinci teleoperation, orthopaedic</text>
<text x="772" y="236" font-size="19" fill="#4b5563" text-anchor="start">cutting guides</text>
<rect x="744" y="284" width="8" height="132" rx="4" fill="#ec362e"/>
<text x="772" y="326" font-size="21" fill="#111827" text-anchor="start" font-weight="700">Johns Hopkins gallbladder work</text>
<text x="772" y="354" font-size="19" fill="#4b5563" text-anchor="start">level 2 edging toward 3,</text>
<text x="772" y="380" font-size="19" fill="#4b5563" text-anchor="start">on ex vivo tissue</text>
<text x="772" y="520" font-size="21" fill="#111827" text-anchor="start" font-weight="700">The key jump is 1 → 2:</text>
<text x="772" y="548" font-size="19" fill="#4b5563" text-anchor="start">from constraining motion</text>
<text x="772" y="574" font-size="19" fill="#4b5563" text-anchor="start">to originating it</text>
</g>
</svg>
