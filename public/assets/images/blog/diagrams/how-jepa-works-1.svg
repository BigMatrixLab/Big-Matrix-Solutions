<text x="835" y="433" font-size="18" fill="#ec362e" text-anchor="middle" font-weight="bold">s_y (stop-gradient)</text>
<path d="M495,200 L495,398" stroke="#4b5563" stroke-width="2" fill="none" stroke-dasharray="6 6" marker-end="url(#ag)"/>
<text x="510" y="300" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">EMA weight update</text>
<text x="510" y="326" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">(not backprop)</text>
<text x="600" y="550" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Large target blocks force semantic inference; the EMA target plus stop-gradient keeps the encoders from collapsing to a constant.</text>
