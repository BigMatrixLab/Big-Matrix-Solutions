<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img">
<title>How NIST AI RMF functions line up with ISO/IEC 42001 clauses</title>
<desc>Four rows pairing the NIST AI RMF functions Govern, Map, Measure and Manage with the ISO/IEC 42001 management-system clauses that cover similar ground. Approximate correspondence.</desc>
<rect x="0" y="0" width="1200" height="720" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start">Same work, two vocabularies</text>
<text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Approximate correspondence; NIST also publishes official crosswalks</text>
<text x="60" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2563eb" text-anchor="start">NIST AI RMF 1.0 function</text>
<text x="650" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ec362e" text-anchor="start">ISO/IEC 42001:2023 clause</text>
<rect x="60" y="175" width="500" height="104" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="219" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Govern</text>
<text x="84" y="253" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Policies, roles, accountability, culture</text>
<line x1="570" y1="227" x2="630" y2="227" stroke="#4b5563" stroke-width="3"/>
<polygon points="630,219 642,227 630,235" fill="#4b5563"/>
<rect x="650" y="175" width="490" height="104" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="674" y="219" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Cl. 5 Leadership, Cl. 7 Support</text>
<text x="674" y="253" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">AI policy, roles, competence, awareness</text>
<rect x="60" y="305" width="500" height="104" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="349" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Map</text>
<text x="84" y="383" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Context, intended use, risks identified</text>
<line x1="570" y1="357" x2="630" y2="357" stroke="#4b5563" stroke-width="3"/>
<polygon points="630,349 642,357 630,365" fill="#4b5563"/>
<rect x="650" y="305" width="490" height="104" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="674" y="349" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Cl. 4 Context, Cl. 6 Planning</text>
<text x="674" y="383" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Scope, risk and impact assessment</text>
<rect x="60" y="435" width="500" height="104" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="479" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Measure</text>
<text x="84" y="513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Test, evaluate, track metrics</text>
<line x1="570" y1="487" x2="630" y2="487" stroke="#4b5563" stroke-width="3"/>
<polygon points="630,479 642,487 630,495" fill="#4b5563"/>
<rect x="650" y="435" width="490" height="104" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="674" y="479" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Cl. 9 Performance evaluation</text>
<text x="674" y="513" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Monitoring, internal audit, review</text>
<rect x="60" y="565" width="500" height="104" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="84" y="609" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Manage</text>
<text x="84" y="643" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Prioritise, treat, respond, monitor</text>
<line x1="570" y1="617" x2="630" y2="617" stroke="#4b5563" stroke-width="3"/>
<polygon points="630,609 642,617 630,625" fill="#4b5563"/>
<rect x="650" y="565" width="490" height="104" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="674" y="609" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Cl. 8 Operation, Cl. 10 Improvement</text>
<text x="674" y="643" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Risk treatment, corrective action</text>
</svg>
