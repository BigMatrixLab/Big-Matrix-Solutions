<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="639" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
<title>Pace the Frontier three-step plan</title>
<desc>Staircase diagram of the essay's three steps: embedded third-party evaluators at each lab, which Anthropic committed to unilaterally; pacing among democracies through common, government-mediated safety standards; and global coordination with authoritarian governments on the highest risks.</desc>
<text x="40" y="62" font-size="30" fill="#111827" font-weight="700">Amodei's three-part plan</text>
<text x="40" y="98" font-size="20" fill="#4b5563">Each step is broader, and harder, than the last</text>
<rect x="40" y="330" width="360" height="270" fill="#f3f4f6" rx="14" stroke="#ec362e" stroke-width="3"/>
<circle cx="80" cy="370" r="22" fill="#ec362e"/>
<text x="80" y="378" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="116" y="378" font-size="21" fill="#111827" font-weight="700">Embedded evaluators</text>
<text x="64" y="426" font-size="19" fill="#111827">Third-party team with</text>
<text x="64" y="454" font-size="19" fill="#111827">ongoing, employee-like</text>
<text x="64" y="482" font-size="19" fill="#111827">access at each lab</text>
<text x="64" y="524" font-size="18" fill="#4b5563" font-weight="700">Who acts:</text>
<text x="64" y="550" font-size="18" fill="#4b5563">individual labs</text>
<text x="64" y="580" font-size="18" fill="#ec362e" font-weight="700">Anthropic committed unilaterally</text>
<rect x="420" y="240" width="360" height="360" fill="#f3f4f6" rx="14" stroke="#d1d5db" stroke-width="2"/>
<circle cx="460" cy="280" r="22" fill="#ec362e"/>
<text x="460" y="288" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="496" y="288" font-size="21" fill="#111827" font-weight="700">Pacing among democracies</text>
<text x="444" y="336" font-size="19" fill="#111827">Common safety standards,</text>
<text x="444" y="364" font-size="19" fill="#111827">government-mediated, with a</text>
<text x="444" y="392" font-size="19" fill="#111827">narrow antitrust waiver</text>
<text x="444" y="434" font-size="18" fill="#4b5563" font-weight="700">Who acts:</text>
<text x="444" y="460" font-size="18" fill="#4b5563">labs, mediated by government</text>
<rect x="800" y="150" width="360" height="450" fill="#ffffff" rx="14" stroke="#d1d5db" stroke-width="2"/>
<circle cx="840" cy="190" r="22" fill="#ec362e"/>
<text x="840" y="198" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="876" y="198" font-size="21" fill="#111827" font-weight="700">Global coordination</text>
<text x="824" y="246" font-size="19" fill="#111827">Agreements with authoritarian</text>
<text x="824" y="274" font-size="19" fill="#111827">governments on the highest</text>
<text x="824" y="302" font-size="19" fill="#111827">risks; verification is hard</text>
<text x="824" y="344" font-size="18" fill="#4b5563" font-weight="700">Who acts:</text>
<text x="824" y="370" font-size="18" fill="#4b5563">governments</text>
</svg>
