<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<title>Residual addition versus U-Net concatenation</title>
<desc>Left: a residual connection adds a layer's output to its input, keeping one signal of the same channel count. Right: a U-Net skip concatenates the upsampled decoder features (256 channels, semantically rich, spatially coarse) with the encoder features (128 channels, spatially precise) into 384 channels, and the following convolution learns how to combine them into 128 channels.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="600" y="48" font-size="26" fill="#111827" text-anchor="middle" font-weight="bold">Skip by addition versus skip by concatenation</text>
<rect x="40" y="80" width="540" height="400" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<rect x="620" y="80" width="540" height="400" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="310" y="120" font-size="22" fill="#111827" text-anchor="middle" font-weight="bold">Residual: x + f(x)</text>
<text x="890" y="120" font-size="22" fill="#111827" text-anchor="middle" font-weight="bold">U-Net: cat([up(d3), e2], dim=1)</text>
<rect x="90" y="170" width="120" height="70" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="150" y="212" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">x · C ch</text>
<rect x="90" y="290" width="120" height="70" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="150" y="332" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">f(x) · C ch</text>
<circle cx="300" cy="265" r="20" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="300" y="273" font-size="22" fill="#111827" text-anchor="middle" font-weight="bold">+</text>
<path d="M210,205 L300,205 L300,243" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M210,325 L300,325 L300,287" stroke="#111827" stroke-width="2" fill="none" marker-end="url(#a)"/>
<line x1="320" y1="265" x2="398" y2="265" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<rect x="400" y="230" width="120" height="70" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="460" y="272" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">C ch</text>
<text x="310" y="420" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">One signal, corrected in place.</text>
<text x="310" y="446" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Same shape in and out.</text>
<rect x="660" y="160" width="130" height="80" rx="6" fill="#ec362e" fill-opacity="0.18" stroke="#ec362e" stroke-width="2"/>
<text x="725" y="196" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">up(d3)</text>
<text x="725" y="222" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">256 ch</text>
<rect x="660" y="290" width="130" height="70" rx="6" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="725" y="320" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">e2</text>
<text x="725" y="346" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">128 ch</text>
<line x1="790" y1="200" x2="838" y2="225" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="790" y1="320" x2="838" y2="300" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<rect x="840" y="180" width="90" height="80" fill="#ec362e" fill-opacity="0.18" stroke="#ec362e" stroke-width="2"/>
<rect x="840" y="260" width="90" height="60" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="885" y="344" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">384 ch</text>
<line x1="930" y1="250" x2="988" y2="250" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<rect x="990" y="210" width="130" height="80" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1055" y="246" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">conv</text>
<text x="1055" y="272" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">→ 128 ch</text>
<text x="890" y="394" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">Coarse “what” (red) and precise “where” (blue)</text>
<text x="890" y="420" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">are kept as separate channels; the conv</text>
<text x="890" y="446" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">learns how to combine them.</text>
</svg>
