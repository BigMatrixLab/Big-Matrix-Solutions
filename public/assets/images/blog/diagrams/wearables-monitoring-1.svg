<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 585" width="1200" height="585" role="img">
<rect x="1" y="1" width="1198" height="583" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Smartwatch atrial fibrillation alert funnels</title>
<desc>Apple Heart Study: 419,297 enrolled, 2,161 notified (0.52%), 450 analysable ECG patches, 34% showed AF. Fitbit Heart Study: 455,699 enrolled, 4,728 received an irregular heart rhythm detection, 1,057 analysable ECG patches, 32.2% showed AF.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">From alert to confirmed atrial fibrillation</text>
<text x="60" y="106" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Two large siteless smartwatch studies with mailed ECG patch confirmation</text>
<text x="60" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Apple Heart Study (NEJM 2019)</text>
<rect x="60.0" y="185" width="520" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">419,297 enrolled</text>
<line x1="320" y1="247" x2="320" y2="269" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="85.0" y="271" width="470" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">2,161 notified (0.52%)</text>
<line x1="320" y1="333" x2="320" y2="355" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="110.0" y="357" width="420" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="320" y="396" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">450 analysable ECG patches</text>
<line x1="320" y1="419" x2="320" y2="441" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="135.0" y="443" width="370" height="62" rx="10" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="320" y="482" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ec362e" text-anchor="middle" font-weight="700" xml:space="preserve">34% showed AF on the patch</text>
<text x="620" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Fitbit Heart Study (Circulation 2022)</text>
<rect x="620.0" y="185" width="520" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="880" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">455,699 enrolled</text>
<line x1="880" y1="247" x2="880" y2="269" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="645.0" y="271" width="470" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="880" y="310" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">4,728 people alerted</text>
<line x1="880" y1="333" x2="880" y2="355" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="670.0" y="357" width="420" height="62" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="880" y="396" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">1,057 analysable ECG patches</text>
<line x1="880" y1="419" x2="880" y2="441" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="695.0" y="443" width="370" height="62" rx="10" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="880" y="482" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ec362e" text-anchor="middle" font-weight="700" xml:space="preserve">32.2% showed AF on the patch</text>
<text x="60" y="553" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Apple study patches went on 13 days after the alert, on average.</text>
</svg>
