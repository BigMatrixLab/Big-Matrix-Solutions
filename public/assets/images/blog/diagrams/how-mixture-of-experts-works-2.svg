<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Inter, Segoe UI, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<title>Stored versus activated expert parameters</title>
<desc>An 8 by 8 grid of 64 experts. All 64 must be held in memory; only 2 are computed for a given token under top-2 routing, a 32 to 1 ratio. That suits hosted serving, where memory is amortised across many requests, and suits single-tenant local deployment poorly.</desc>
