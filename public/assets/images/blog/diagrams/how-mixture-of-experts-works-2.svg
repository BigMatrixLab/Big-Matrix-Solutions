<text x="262" y="498" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">64 experts in one MoE layer</text>
<rect x="520" y="110" width="30" height="30" rx="5" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="566" y="132" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Stored in memory: all 64 experts</text>
<text x="566" y="160" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">64× a dense feed-forward layer</text>
<rect x="520" y="190" width="30" height="30" rx="5" fill="#ec362e"/>
<text x="566" y="212" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Computed for this token: 2 experts</text>
<text x="566" y="240" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">2× a dense layer, so 32× stored per unit used</text>
<line x1="520" y1="280" x2="1150" y2="280" stroke="#d1d5db" stroke-width="2"/>
<text x="520" y="320" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Hosted API serving: a good deal</text>
<text x="520" y="348" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">Memory is paid once and shared by thousands</text>
<text x="520" y="374" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">of concurrent requests; cost per token falls.</text>
<text x="520" y="424" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Local or single-tenant: a poor deal</text>
<text x="520" y="452" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">You hold every expert in memory to get the</text>
<text x="520" y="478" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">throughput of a much smaller dense model.</text>
