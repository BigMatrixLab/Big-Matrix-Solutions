<title>FDA-cleared AI algorithms by specialty, as of 30 March 2026</title>
<desc>Of 1,524 FDA-cleared AI algorithms, 1,163 (76.31%) are for radiology and 361 for all other specialties. 68 radiology algorithms were cleared in January to March 2026. One January 2026 clearance covered 14 conditions.</desc>
