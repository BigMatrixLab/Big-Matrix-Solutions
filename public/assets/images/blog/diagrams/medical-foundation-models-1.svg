<text x="600" y="98" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">FDA-cleared AI algorithms as of 30 March 2026: 1,524 in total</text>
<text x="100" y="160" font-size="22" font-weight="700" fill="#111827" text-anchor="start">Radiology: 1,163 (76.31%)</text>
<text x="1100" y="160" font-size="22" font-weight="700" fill="#4b5563" text-anchor="end">All other: 361</text>
