<title>Multiple-instance learning for whole-slide images</title>
<desc>A whole-slide image of roughly 100,000 by 100,000 pixels is cut into thousands of tiles, each encoded to a feature vector, then aggregated into one slide-level prediction trained from a slide-level label.</desc>
