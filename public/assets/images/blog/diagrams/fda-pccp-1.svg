<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
<rect x="1" y="1" width="1198" height="598" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Structure of a Predetermined Change Control Plan</title>
<desc>Three components of a PCCP: Description of Modifications, Modification Protocol and Impact Assessment. The plan is authorised with the device. Changes inside the plan, made per the protocol, need no new submission; changes outside it, or deviations, need a new marketing submission.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">What goes into a PCCP, and what it buys</text>
<text x="60" y="106" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">FDA final guidance for AI-enabled device software functions</text>
<rect x="60" y="140" width="340" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="230" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Description of</text>
<text x="230" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Modifications</text>
<text x="230" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">What will change:</text>
<text x="230" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">specific, planned,</text>
<text x="230" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">verifiable updates</text>
<rect x="430" y="140" width="340" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="600" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Modification</text>
<text x="600" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Protocol</text>
<text x="600" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">How it is done:</text>
<text x="600" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">data, re-training,</text>
<text x="600" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">tests, update steps</text>
<rect x="800" y="140" width="340" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="970" y="185" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Impact</text>
<text x="970" y="215" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Assessment</text>
<text x="970" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">Benefits and risks</text>
<text x="970" y="290" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">of each change, and</text>
<text x="970" y="318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" font-weight="400" xml:space="preserve">risk mitigations</text>
<text x="600" y="385" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Authorised once, with the device (510(k), De Novo or PMA)</text>
<line x1="600" y1="400" x2="600" y2="430" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="60" y="440" width="520" height="120" rx="10" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="320" y="485" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Change is in the plan and the</text>
<text x="320" y="515" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">protocol is followed</text>
<text x="320" y="545" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ec362e" text-anchor="middle" font-weight="700" xml:space="preserve">Ship it: no new submission</text>
<rect x="620" y="440" width="520" height="120" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="880" y="485" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">Change is outside the plan, or</text>
<text x="880" y="515" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700" xml:space="preserve">the protocol cannot be met</text>
<text x="880" y="545" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#2563eb" text-anchor="middle" font-weight="700" xml:space="preserve">New marketing submission</text>
</svg>
