<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
<rect x="1" y="1" width="1198" height="598" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>From polysemantic neurons to sparse features</title>
<desc>A neuron in a trained model responds to unrelated things, such as legal citations, a Python idiom and boats, because features are packed in superposition. A sparse autoencoder re-expresses the activations in a much wider layer where only a few units are active at once, each closer to a single interpretable feature.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="60" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Reading features instead of neurons</text>
<text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">A sparse autoencoder unpacks superposition into a wider, sparser basis</text>
<text x="60" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">One neuron</text>
<circle cx="160" cy="320" r="70" fill="#f3f4f6" stroke="#ec362e" stroke-width="3"/>
<text x="160" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="400">fires for</text>
<text x="160" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="400">many things</text>
<text x="60" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="400">• legal citations</text>
<text x="60" y="470" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="400">• a Python idiom</text>
<text x="60" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="400">• something about boats</text>
<line x1="250" y1="320" x2="360" y2="320" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="370" y="270" width="200" height="100" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="470" y="314" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Sparse</text>
<text x="470" y="342" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">autoencoder</text>
<line x1="574" y1="320" x2="650" y2="320" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="670" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Many more features, few active</text>
<rect x="670" y="190" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="214" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="238" width="30" height="18" rx="4" fill="#ec362e" stroke="none" stroke-width="1.5"/>
<text x="716" y="255" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="600">Legal citation feature</text>
<rect x="670" y="262" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="286" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="310" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="334" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="358" width="30" height="18" rx="4" fill="#ec362e" stroke="none" stroke-width="1.5"/>
<text x="716" y="375" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="600">Python idiom feature</text>
<rect x="670" y="382" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="406" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="430" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="454" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="478" width="30" height="18" rx="4" fill="#ec362e" stroke="none" stroke-width="1.5"/>
<text x="716" y="495" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="start" font-weight="600">Boats feature</text>
<rect x="670" y="502" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<rect x="670" y="526" width="30" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
<text x="670" y="570" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">A sparsity penalty keeps most units off</text>
</svg>
