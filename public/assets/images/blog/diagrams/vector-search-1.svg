<text x="60" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Missed: #7 (red, top row).  Returned instead: #14, the 14th-closest vector.</text>
<text x="60" y="450" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="400" xml:space="preserve">Raising efSearch visits more of the graph: recall goes up, and so does latency.</text>
