<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img">
<rect x="1" y="1" width="1198" height="488" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Recall at 10 illustrated</title>
<desc>Illustration of recall@10: an approximate index returns nine of the ten true nearest neighbours plus the fourteenth-closest vector, so recall@10 is 0.9.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Recall@10: how much of the true top 10 did the index return?</text>
<text x="60" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400" xml:space="preserve">Illustration. Exact search scans every vector; the approximate index visits a fraction.</text>
<text x="60" y="186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="start" font-weight="700" xml:space="preserve">Exact (brute force)</text>
