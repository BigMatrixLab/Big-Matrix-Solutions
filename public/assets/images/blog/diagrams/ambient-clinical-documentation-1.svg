<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="1" y="1" width="1198" height="598" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>What an ambient AI scribe has to get right</title>
<desc>Six stages from room audio to a signed note: diarisation, clinical vocabulary, relevance, specialty template, draft note and clinician sign-off. A key failure mode is a negative finding nobody discussed being written into the record.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="600" y="62" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">What an ambient scribe has to get right</text>
<text x="600" y="98" font-size="21" font-weight="400" fill="#4b5563" text-anchor="middle">From room audio to a signed note</text>
<rect x="40" y="140" width="340" height="110" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="210.0" y="186.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">1  Diarisation</text>
<text x="210.0" y="216.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">who said which words</text>
<rect x="430" y="140" width="340" height="110" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="600.0" y="186.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">2  Clinical vocabulary</text>
<text x="600.0" y="216.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">drug names, doses, decimals</text>
<rect x="820" y="140" width="340" height="110" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="990.0" y="186.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">3  Relevance</text>
<text x="990.0" y="216.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">clinical facts vs small talk</text>
<line x1="382" y1="195" x2="426" y2="195" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<line x1="772" y1="195" x2="816" y2="195" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<line x1="990" y1="252" x2="990" y2="316" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="320" width="340" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="210.0" y="366.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">6  Clinician signs</text>
<text x="210.0" y="396.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">nothing enters unread</text>
<rect x="430" y="320" width="340" height="110" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="600.0" y="366.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">5  Draft note</text>
<text x="600.0" y="396.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">shown as a draft to review</text>
<rect x="820" y="320" width="340" height="110" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="990.0" y="366.6" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">4  Specialty template</text>
<text x="990.0" y="396.6" font-size="20" font-weight="400" fill="#4b5563" text-anchor="middle">right section, billing codes</text>
<line x1="818" y1="375" x2="772" y2="375" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<line x1="428" y1="375" x2="382" y2="375" stroke="#4b5563" stroke-width="3" marker-end="url(#ah)"/>
<rect x="40" y="470" width="1120" height="90" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="600" y="506" font-size="20" font-weight="700" fill="#ec362e" text-anchor="middle">Failure mode to test for</text>
<text x="600" y="538" font-size="20" font-weight="400" fill="#111827" text-anchor="middle">a negative finding nobody actually discussed, written into the record</text>
</svg>
