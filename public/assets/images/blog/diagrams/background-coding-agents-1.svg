<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<rect x="1" y="1" width="1198" height="558" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>The asynchronous delegation loop</title>
<desc>Four steps: write a brief, the agent runs in an isolated sandbox, a human reviews the pull request, review comments send the agent back to run again until the change is merged.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker></defs>
<text x="60" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">The delegation loop</text>
<text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">You are present at the two ends; the agent works unsupervised in the middle</text>
<rect x="60" y="150" width="240" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="80" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">1. Write the brief</text>
<text x="80" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Outcome, constraints,</text>
<text x="80" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">definition of done,</text>
<text x="80" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">what to do if stuck</text>
<rect x="340" y="150" width="240" height="200" rx="10" fill="#f3f4f6" stroke="#ec362e" stroke-width="3"/>
<text x="360" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">2. Agent runs</text>
<text x="360" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Own container, worktree</text>
<text x="360" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">and branch. Reads, edits,</text>
<text x="360" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">runs tests, iterates</text>
<rect x="620" y="150" width="240" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="640" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">3. Review the PR</text>
<text x="640" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Diff and description in</text>
<text x="640" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">your normal review tool</text>
<rect x="900" y="150" width="240" height="200" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="920" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">4. Comment</text>
<text x="920" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Agent addresses</text>
<text x="920" y="262" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">review comments</text>
<text x="920" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">and pushes again</text>
<line x1="304" y1="250" x2="336" y2="250" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="584" y1="250" x2="616" y2="250" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="864" y1="250" x2="896" y2="250" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M 1020 354 L 1020 420 L 460 420 L 460 360" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="740" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ec362e" text-anchor="middle" font-weight="600">Iterate until the change is right, or reject it</text>
<rect x="60" y="490" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#ec362e" stroke-width="3"/>
<text x="88" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Unsupervised: minutes to hours, no one watching</text>
<rect x="560" y="490" width="18" height="18" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="588" y="506" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="start" font-weight="400">Human time: specifying and reviewing</text>
</svg>
