  <rect x="0" y="0" width="1200" height="506" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">You pay memory for all of it, compute for a sliver</title>
  <desc id="d">A grid of 100 squares, each 1 percent of a trillion-parameter mixture-of-experts model. All squares are resident in memory; 3 squares, about 30 billion parameters, are active per token.</desc>
  <text x="40" y="54" font-size="28" fill="#111827" text-anchor="start" font-weight="700">You pay memory for all of it, compute for a sliver</text>
  <text x="40" y="90" font-size="20" fill="#4b5563" text-anchor="start">Trillion-parameter MoE: one square = 1% of total parameters</text>
