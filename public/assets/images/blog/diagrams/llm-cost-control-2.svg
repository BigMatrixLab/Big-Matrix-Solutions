<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img">
<rect x="1" y="1" width="1198" height="468" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Prompt layout for cache hits</title>
<desc>A prompt laid out as tools, system prompt, reference documents, conversation history and the new user turn. Everything up to the breakpoint before the new turn is a prefix that can be cached; the new turn changes every request. Anthropic builds cache prefixes in the order tools, system, messages, and a change early in the prompt invalidates everything after it.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Lay the prompt out for the cache</text>
<text x="60" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">Caches match an exact prefix: stable content first, volatile content last</text>
<rect x="60" y="150" width="150" height="90" rx="8" fill="#d1d5db" stroke="#ffffff" stroke-width="3"/>
<text x="135.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Tools</text>
<rect x="210" y="150" width="250" height="90" rx="8" fill="#d1d5db" stroke="#ffffff" stroke-width="3"/>
<text x="335.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">System prompt</text>
<rect x="460" y="150" width="260" height="90" rx="8" fill="#d1d5db" stroke="#ffffff" stroke-width="3"/>
<text x="590.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Reference docs</text>
<rect x="720" y="150" width="220" height="90" rx="8" fill="#f3f4f6" stroke="#ffffff" stroke-width="3"/>
<text x="830.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">History</text>
<rect x="940" y="150" width="200" height="90" rx="8" fill="#ec362e" stroke="#ffffff" stroke-width="3"/>
<text x="1040.0" y="203" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">New turn</text>
<line x1="940" y1="138" x2="940" y2="252" stroke="#2563eb" stroke-width="4"/>
<text x="940" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="700">cache breakpoint</text>
<path d="M60,262 v14 h876 v-14" fill="none" stroke="#4b5563" stroke-width="2"/>
<text x="498" y="306" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="400">Cached prefix: written once, then read at a discount</text>
<path d="M944,262 v14 h196 v-14" fill="none" stroke="#4b5563" stroke-width="2"/>
<text x="1042" y="306" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="400">Full price</text>
<text x="60" y="376" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">Anthropic builds prefixes in the order tools, system, messages.</text>
<text x="60" y="410" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">Edit a tool definition and every segment after it misses the cache.</text>
</svg>
