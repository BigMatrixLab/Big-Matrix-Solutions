<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
<title>Scaled dot-product attention, one head</title>
<desc>Token vectors are projected into queries, keys and values. Every query is scored against every key, scaled by the square root of d_k, softmaxed per row, and used to take a weighted average of the values. Below, illustrative weights for the query of the token 'it' over earlier tokens: 'animal' gets the most weight.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ec362e"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="600" y="48" font-size="26" fill="#111827" text-anchor="middle" font-weight="bold">Scaled dot-product attention (one head)</text>
<rect x="40" y="90" width="230" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="155.0" y="148.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Token vectors x</text>
<text x="155.0" y="174.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">(seq × d_model)</text>
<rect x="320" y="90" width="250" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="445.0" y="135.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Q = x · W_q</text>
<text x="445.0" y="161.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">K = x · W_k</text>
<text x="445.0" y="187.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">V = x · W_v</text>
<rect x="620" y="90" width="250" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="745.0" y="135.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">Q · Kᵀ / √d_k</text>
<text x="745.0" y="161.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">score matrix</text>
<text x="745.0" y="187.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">(seq × seq)</text>
<rect x="920" y="90" width="240" height="130" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="1040.0" y="135.3" font-size="18" fill="#111827" text-anchor="middle" font-weight="bold">softmax per row</text>
<text x="1040.0" y="161.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">then weights · V</text>
<text x="1040.0" y="187.3" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="normal">(seq × d_v)</text>
<line x1="270" y1="155" x2="316" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="570" y1="155" x2="616" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<line x1="870" y1="155" x2="916" y2="155" stroke="#111827" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="250" width="1120" height="330" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="70" y="288" font-size="20" fill="#111827" text-anchor="start" font-weight="bold">Example: the query for “it” scored against earlier tokens</text>
<text x="250" y="331" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">the</text>
<rect x="270" y="312" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="312" width="28" height="26" rx="4" fill="#d1d5db"/>
<text x="310.0" y="331" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.04</text>
<text x="250" y="371" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">animal</text>
<rect x="270" y="352" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="352" width="427" height="26" rx="4" fill="#ec362e"/>
<text x="709.0" y="371" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.61</text>
<text x="250" y="411" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">cross</text>
<rect x="270" y="392" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="392" width="35" height="26" rx="4" fill="#d1d5db"/>
<text x="317.0" y="411" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.05</text>
<text x="250" y="451" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">street</text>
<rect x="270" y="432" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="432" width="63" height="26" rx="4" fill="#d1d5db"/>
<text x="345.0" y="451" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.09</text>
<text x="250" y="491" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">because</text>
<rect x="270" y="472" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="472" width="42" height="26" rx="4" fill="#d1d5db"/>
<text x="324.0" y="491" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.06</text>
<text x="250" y="531" font-size="18" fill="#111827" text-anchor="end" font-weight="normal">it</text>
<rect x="270" y="512" width="700" height="26" rx="4" fill="#f3f4f6"/>
<rect x="270" y="512" width="105" height="26" rx="4" fill="#d1d5db"/>
<text x="387.0" y="531" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">0.15</text>
<text x="70" y="560" font-size="18" fill="#4b5563" text-anchor="start" font-weight="normal">Illustrative weights. Each softmax row sums to 1; the output for “it” is the weighted average of these tokens’ value vectors.</text>
</svg>
