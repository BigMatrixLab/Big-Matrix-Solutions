<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img">
<rect x="1" y="1" width="1198" height="478" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<title>Chained pipeline versus speech-to-speech</title>
<desc>Top: a chained voice pipeline passes microphone audio to speech-to-text, then a text model, then text-to-speech, with inspectable text between stages. Bottom: a speech-to-speech model takes audio in and produces audio out in one session, with fewer hops.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="60" y="64" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Two ways to build a voice agent</text>
<text x="60" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Chained</text>
<text x="160" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">text you can inspect between every stage</text>
<rect x="60" y="150" width="150" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="135.0" y="202.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Audio in</text>
<rect x="260" y="150" width="190" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="355.0" y="202.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Speech-to-text</text>
<rect x="500" y="150" width="190" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="595.0" y="202.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Text model</text>
<rect x="740" y="150" width="190" height="90" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<text x="835.0" y="202.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Text-to-speech</text>
<rect x="980" y="150" width="160" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="1060.0" y="202.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Audio out</text>
<line x1="210" y1="195" x2="258" y2="195" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="450" y1="195" x2="498" y2="195" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="690" y1="195" x2="738" y2="195" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="930" y1="195" x2="978" y2="195" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="60" y="308" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Speech-to-speech</text>
<text x="262" y="308" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#4b5563" text-anchor="start" font-weight="400">one model hears and speaks, in one session</text>
<rect x="60" y="330" width="150" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="135.0" y="382.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Audio in</text>
<rect x="310" y="330" width="570" height="90" rx="10" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="595.0" y="369.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Speech-to-speech model</text>
<text x="595.0" y="395.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#4b5563" text-anchor="middle" font-weight="400">audio in, audio out, tool calls</text>
<rect x="980" y="330" width="160" height="90" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
<text x="1060.0" y="382.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" font-weight="700">Audio out</text>
<line x1="210" y1="375" x2="308" y2="375" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="880" y1="375" x2="978" y2="375" stroke="#4b5563" stroke-width="2.5" marker-end="url(#ah)"/>
</svg>
