<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img">
<title>What AI ROI calculations usually count versus what they should count</title>
<desc>Two columns comparing the inputs commonly used in AI pilot ROI estimates with the fuller set of costs and measured outcomes an honest ROI calculation needs.</desc>
<rect x="0" y="0" width="1200" height="612" fill="#ffffff" rx="16" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827" text-anchor="start">Honest ROI counts the whole system</text>
<text x="60" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#4b5563" text-anchor="start">Illustrative checklist, not data</text>
<rect x="60" y="130" width="520" height="452" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/>
<rect x="620" y="130" width="520" height="452" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2"/>
<text x="90" y="178" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#4b5563" text-anchor="start">Often counted</text>
<text x="650" y="178" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#ec362e" text-anchor="start">Also needs counting</text>
<text x="90" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">- Licence or API spend</text>
<text x="90" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">- Pilot team time</text>
<text x="90" y="354" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">- Self-reported time saved</text>
<text x="90" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#4b5563" text-anchor="start">- Best-case demo tasks</text>
<text x="650" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Integration and data work</text>
<text x="650" y="292" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Evaluation and monitoring</text>
<text x="650" y="354" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Human review of outputs</text>
<text x="650" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Rework when output is wrong</text>
<text x="650" y="478" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Change management, training</text>
<text x="650" y="540" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#111827" text-anchor="start">+ Outcome vs. a control group</text>
</svg>
