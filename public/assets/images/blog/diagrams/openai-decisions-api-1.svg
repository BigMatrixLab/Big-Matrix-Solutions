<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Inter, Segoe UI, Arial, sans-serif">
<rect x="0.5" y="0.5" width="1199" height="579" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
<title>Decisions API request flow</title>
<desc>Diagram: a question, a fixed list of allowed answers and text or image context go into the Decisions API, a constrained version of GPT-6 Luna, which returns one of the predefined answers in about 150 ms.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<text x="40" y="62" font-size="30" fill="#111827" font-weight="700">How the Decisions API works</text>
<text x="40" y="98" font-size="20" fill="#4b5563">You supply the question and the allowed answers; GPT-6 Luna picks one</text>
<rect x="40" y="150" width="330" height="84" fill="#f3f4f6" rx="12" stroke="#d1d5db" stroke-width="2"/>
<text x="64" y="186" font-size="22" fill="#111827" font-weight="700">Question</text>
<text x="64" y="216" font-size="20" fill="#4b5563">e.g. route this request</text>
<line x1="372" y1="192" x2="470" y2="250" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="258" width="330" height="84" fill="#f3f4f6" rx="12" stroke="#d1d5db" stroke-width="2"/>
<text x="64" y="294" font-size="22" fill="#111827" font-weight="700">Allowed answers</text>
<text x="64" y="324" font-size="20" fill="#4b5563">a fixed, predefined list</text>
<line x1="372" y1="300" x2="470" y2="282" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="366" width="330" height="84" fill="#f3f4f6" rx="12" stroke="#d1d5db" stroke-width="2"/>
<text x="64" y="402" font-size="22" fill="#111827" font-weight="700">Context</text>
<text x="64" y="432" font-size="20" fill="#4b5563">text or images</text>
<line x1="372" y1="408" x2="470" y2="314" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<rect x="474" y="212" width="300" height="140" fill="#ffffff" rx="16" stroke="#ec362e" stroke-width="3"/>
<text x="624" y="262" font-size="24" fill="#111827" font-weight="700" text-anchor="middle">Decisions API</text>
<text x="624" y="294" font-size="20" fill="#4b5563" text-anchor="middle">constrained GPT-6 Luna</text>
<text x="624" y="324" font-size="20" fill="#ec362e" font-weight="700" text-anchor="middle">~150 ms per answer</text>
<line x1="776" y1="282" x2="846" y2="282" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
<rect x="850" y="212" width="310" height="140" fill="#f3f4f6" rx="16" stroke="#d1d5db" stroke-width="2"/>
<text x="1005" y="262" font-size="22" fill="#111827" font-weight="700" text-anchor="middle">One of your answers</text>
<text x="1005" y="294" font-size="20" fill="#4b5563" text-anchor="middle">never free-form text</text>
<line x1="40" y1="500" x2="1160" y2="500" stroke="#f3f4f6" stroke-width="2"/>
<text x="40" y="540" font-size="20" fill="#111827">Named uses: classifying content · routing requests · choosing an agent's next action</text>
</svg>
