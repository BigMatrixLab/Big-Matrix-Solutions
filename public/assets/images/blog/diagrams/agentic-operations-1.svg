<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="480" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">Autonomous incident response loop with an approval gate</title>
  <desc id="d">Five stages in a row: detect anomalies beyond simple thresholds, diagnose root cause from logs, metrics and traces, a human approval gate for critical actions, execute a rollback, scale-out or reconfiguration, and learn by storing the fix. A loop returns from learn to detect, and an immutable audit log runs underneath every stage.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
  </defs>
  <text x="600" y="54" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">Incident response, with a human where it matters</text>

  <g font-size="18" fill="#4b5563" text-anchor="middle">
    <rect x="30" y="100" width="204" height="160" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="132" y="145" font-size="22" font-weight="700" fill="#111827">Detect</text>
    <text x="132" y="190">anomalies beyond</text>
    <text x="132" y="216">simple thresholds</text>

    <rect x="264" y="100" width="204" height="160" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="366" y="145" font-size="22" font-weight="700" fill="#111827">Diagnose</text>
    <text x="366" y="190">logs, metrics and</text>
    <text x="366" y="216">traces → root cause</text>

    <rect x="498" y="100" width="204" height="160" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="600" y="145" font-size="22" font-weight="700" fill="#ec362e">Approve</text>
    <text x="600" y="190">human sign-off for</text>
    <text x="600" y="216">critical actions</text>

    <rect x="732" y="100" width="204" height="160" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="834" y="145" font-size="22" font-weight="700" fill="#111827">Execute</text>
    <text x="834" y="190">rollback, scale</text>
    <text x="834" y="216">or reconfigure</text>

    <rect x="966" y="100" width="204" height="160" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="1068" y="145" font-size="22" font-weight="700" fill="#111827">Learn</text>
    <text x="1068" y="190">store the fix to</text>
    <text x="1068" y="216">prevent repeats</text>
  </g>
  <g stroke="#4b5563" stroke-width="2" fill="none">
    <line x1="236" y1="180" x2="260" y2="180" marker-end="url(#a)"/>
    <line x1="470" y1="180" x2="494" y2="180" marker-end="url(#a)"/>
    <line x1="704" y1="180" x2="728" y2="180" marker-end="url(#a)"/>
    <line x1="938" y1="180" x2="962" y2="180" marker-end="url(#a)"/>
    <path d="M1068,262 V305 H132 V266" marker-end="url(#a)"/>
  </g>
  <text x="600" y="335" text-anchor="middle" font-size="18" fill="#4b5563">what was learned feeds the next detection</text>

  <rect x="30" y="365" width="1140" height="80" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="60" y="412" font-size="20" font-weight="700" fill="#111827">Immutable audit log</text>
  <text x="290" y="412" font-size="18" fill="#4b5563">every observation, reasoning trace and action, for auditors</text>
</svg>
