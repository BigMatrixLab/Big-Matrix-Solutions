<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>How a systolic array multiplies matrices</title>
  <desc>Weights are loaded into a grid of multiply-accumulate cells. Activations stream in from the left, each cell multiplies and adds, and partial sums flow downward and out of the bottom without returning to memory between steps.</desc>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <text x="60" y="64" font-size="30" font-weight="700" fill="#111827">Systolic array: data moves cell to cell, not back to memory</text>
  <text x="60" y="100" font-size="20" fill="#4b5563">Simplified 4 x 4 grid. A TPU7x or v6e MXU is 256 x 256 multiply-accumulators.</text>

  <!-- weights label -->
  <text x="560" y="150" font-size="20" fill="#4b5563" text-anchor="middle">Weights pre-loaded into each cell</text>

  <!-- activations in -->
  <g font-size="20" fill="#111827" text-anchor="end">
    <text x="300" y="210">x1</text>
    <text x="300" y="300">x2</text>
    <text x="300" y="390">x3</text>
    <text x="300" y="480">x4</text>
  </g>
  <g stroke="#ec362e" stroke-width="3" fill="none">
    <line x1="312" y1="203" x2="372" y2="203"/>
    <line x1="312" y1="293" x2="372" y2="293"/>
    <line x1="312" y1="383" x2="372" y2="383"/>
    <line x1="312" y1="473" x2="372" y2="473"/>
  </g>
  <g fill="#ec362e">
    <polygon points="372,195 386,203 372,211"/>
    <polygon points="372,285 386,293 372,301"/>
    <polygon points="372,375 386,383 372,391"/>
    <polygon points="372,465 386,473 372,481"/>
  </g>
  <text x="320" y="150" font-size="20" fill="#ec362e" text-anchor="end">Activations in</text>

  <!-- grid of MAC cells -->
  <g fill="#f3f4f6" stroke="#d1d5db" stroke-width="2">
    <rect x="390" y="170" width="70" height="66" rx="8"/><rect x="480" y="170" width="70" height="66" rx="8"/><rect x="570" y="170" width="70" height="66" rx="8"/><rect x="660" y="170" width="70" height="66" rx="8"/>
    <rect x="390" y="260" width="70" height="66" rx="8"/><rect x="480" y="260" width="70" height="66" rx="8"/><rect x="570" y="260" width="70" height="66" rx="8"/><rect x="660" y="260" width="70" height="66" rx="8"/>
    <rect x="390" y="350" width="70" height="66" rx="8"/><rect x="480" y="350" width="70" height="66" rx="8"/><rect x="570" y="350" width="70" height="66" rx="8"/><rect x="660" y="350" width="70" height="66" rx="8"/>
    <rect x="390" y="440" width="70" height="66" rx="8"/><rect x="480" y="440" width="70" height="66" rx="8"/><rect x="570" y="440" width="70" height="66" rx="8"/><rect x="660" y="440" width="70" height="66" rx="8"/>
  </g>
  <g font-size="18" fill="#111827" text-anchor="middle">
    <text x="425" y="210">MAC</text><text x="515" y="210">MAC</text><text x="605" y="210">MAC</text><text x="695" y="210">MAC</text>
    <text x="425" y="300">MAC</text><text x="515" y="300">MAC</text><text x="605" y="300">MAC</text><text x="695" y="300">MAC</text>
    <text x="425" y="390">MAC</text><text x="515" y="390">MAC</text><text x="605" y="390">MAC</text><text x="695" y="390">MAC</text>
    <text x="425" y="480">MAC</text><text x="515" y="480">MAC</text><text x="605" y="480">MAC</text><text x="695" y="480">MAC</text>
  </g>

  <!-- partial sums down -->
  <g stroke="#2563eb" stroke-width="3">
    <line x1="425" y1="512" x2="425" y2="548"/><line x1="515" y1="512" x2="515" y2="548"/><line x1="605" y1="512" x2="605" y2="548"/><line x1="695" y1="512" x2="695" y2="548"/>
  </g>
  <g fill="#2563eb">
    <polygon points="417,548 425,562 433,548"/><polygon points="507,548 515,562 523,548"/><polygon points="597,548 605,562 613,548"/><polygon points="687,548 695,562 703,548"/>
  </g>
  <text x="560" y="600" font-size="20" fill="#2563eb" text-anchor="middle">Partial sums flow down and out as results</text>

  <!-- explanation panel -->
  <g font-size="20" fill="#111827">
    <text x="790" y="200" font-weight="700">Each cell, every clock:</text>
    <text x="790" y="240">1. take x from the left</text>
    <text x="790" y="276">2. multiply by its weight</text>
    <text x="790" y="312">3. add the sum from above</text>
    <text x="790" y="348">4. pass x right, sum down</text>
  </g>
  <g font-size="20" fill="#4b5563">
    <text x="790" y="410">No memory access between</text>
    <text x="790" y="440">steps: operands are reused</text>
    <text x="790" y="470">as they pass through.</text>
    <text x="790" y="520">Trade-off: very good at dense</text>
    <text x="790" y="550">matrix maths, poor at much else.</text>
  </g>
</svg>
