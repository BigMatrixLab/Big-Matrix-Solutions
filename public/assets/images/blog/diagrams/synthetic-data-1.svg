<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title>Replace versus accumulate: two ways to recycle model outputs</title>
  <desc>Top: each generation trains only on the previous model's outputs, replacing the real data; this is the setting in which model collapse appears. Bottom: each generation trains on the original real data plus all synthetic data so far; Gerstgrasser and colleagues found test error stays bounded in this setting.</desc>
  <rect x="0" y="0" width="1200" height="600" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#111827">Replace vs accumulate</text>
  <text x="60" y="94" font-size="20" fill="#4b5563">What each model generation is trained on</text>

  <!-- Replace row -->
  <text x="60" y="156" font-size="22" font-weight="700" fill="#ec362e">Replace: collapse</text>
  <g font-size="18" text-anchor="middle">
    <rect x="60" y="180" width="200" height="60" rx="8" fill="#2563eb"/><text x="160" y="217" fill="#ffffff" font-weight="700">Real data</text>
    <rect x="330" y="180" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="430" y="217" fill="#111827">Synthetic gen 1</text>
    <rect x="600" y="180" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="700" y="217" fill="#111827">Synthetic gen 2</text>
    <rect x="870" y="180" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="970" y="217" fill="#111827">Synthetic gen 3</text>
  </g>
  <g stroke="#4b5563" stroke-width="2">
    <line x1="262" y1="210" x2="320" y2="210"/><line x1="532" y1="210" x2="590" y2="210"/><line x1="802" y1="210" x2="860" y2="210"/>
  </g>
  <g fill="#4b5563"><polygon points="320,203 330,210 320,217"/><polygon points="590,203 600,210 590,217"/><polygon points="860,203 870,210 860,217"/></g>
  <text x="60" y="280" font-size="18" fill="#4b5563">Real data is dropped after the first round. Rare cases (the tails) vanish first.</text>

  <!-- Accumulate row -->
  <text x="60" y="350" font-size="22" font-weight="700" fill="#2563eb">Accumulate: bounded error</text>
  <g font-size="18" text-anchor="middle">
    <rect x="60" y="374" width="200" height="60" rx="8" fill="#2563eb"/><text x="160" y="411" fill="#ffffff" font-weight="700">Real</text>

    <rect x="330" y="374" width="200" height="30" rx="6" fill="#2563eb"/><text x="430" y="395" fill="#ffffff" font-weight="700">Real</text>
    <rect x="330" y="406" width="200" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="430" y="426" fill="#111827">+ gen 1</text>

    <rect x="600" y="374" width="200" height="30" rx="6" fill="#2563eb"/><text x="700" y="395" fill="#ffffff" font-weight="700">Real</text>
    <rect x="600" y="406" width="200" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="700" y="426" fill="#111827">+ gen 1, 2</text>

    <rect x="870" y="374" width="200" height="30" rx="6" fill="#2563eb"/><text x="970" y="395" fill="#ffffff" font-weight="700">Real</text>
    <rect x="870" y="406" width="200" height="28" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="2"/><text x="970" y="426" fill="#111827">+ gen 1, 2, 3</text>
  </g>
  <g stroke="#4b5563" stroke-width="2">
    <line x1="262" y1="404" x2="320" y2="404"/><line x1="532" y1="404" x2="590" y2="404"/><line x1="802" y1="404" x2="860" y2="404"/>
  </g>
  <g fill="#4b5563"><polygon points="320,397 330,404 320,411"/><polygon points="590,397 600,404 590,411"/><polygon points="860,397 870,404 860,411"/></g>
  <text x="60" y="474" font-size="18" fill="#4b5563">The original real data stays in every round; synthetic data is added, never substituted.</text>

  <text x="60" y="540" font-size="18" fill="#4b5563">Top: setting of Shumailov et al., Nature 2024. Bottom: Gerstgrasser et al., 2024.</text>
</svg>
