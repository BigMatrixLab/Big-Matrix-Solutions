<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 374" width="1200" height="374" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="374" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">A 25x price gap between Sol and Luna</title>
  <desc id="d">Two bar panels. Input price per million tokens: Sol 5 dollars, Terra 2 dollars, Luna 0.20 dollars. Output: Sol 30 dollars, Terra 12 dollars, Luna 1.20 dollars.</desc>
  <text x="40" y="54" font-size="28" fill="#111827" text-anchor="start" font-weight="700">A 25x price gap between Sol and Luna</text>
  <text x="40" y="90" font-size="20" fill="#4b5563" text-anchor="start">GPT-5.6 list price per 1M tokens after the July 30 cuts</text>
  <text x="40" y="140" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Input / 1M tokens</text>
  <rect x="130" y="164" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="130" y="164" width="270.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="40" y="186" font-size="20" fill="#111827" text-anchor="start">Sol</text>
  <text x="412.0" y="186" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$5</text>
  <rect x="130" y="214" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="130" y="214" width="108.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="40" y="236" font-size="20" fill="#111827" text-anchor="start">Terra</text>
  <text x="250.0" y="236" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$2</text>
  <rect x="130" y="264" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="130" y="264" width="10.8" height="30" rx="4" fill="#ec362e"/>
  <text x="40" y="286" font-size="20" fill="#111827" text-anchor="start">Luna</text>
  <text x="152.8" y="286" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$0.20</text>
  <text x="620" y="140" font-size="22" fill="#111827" text-anchor="start" font-weight="700">Output / 1M tokens</text>
  <rect x="710" y="164" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="710" y="164" width="270.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="620" y="186" font-size="20" fill="#111827" text-anchor="start">Sol</text>
  <text x="992.0" y="186" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$30</text>
  <rect x="710" y="214" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="710" y="214" width="108.0" height="30" rx="4" fill="#d1d5db"/>
  <text x="620" y="236" font-size="20" fill="#111827" text-anchor="start">Terra</text>
  <text x="830.0" y="236" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$12</text>
  <rect x="710" y="264" width="270" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="710" y="264" width="10.8" height="30" rx="4" fill="#ec362e"/>
  <text x="620" y="286" font-size="20" fill="#111827" text-anchor="start">Luna</text>
  <text x="732.8" y="286" font-size="20" fill="#111827" text-anchor="start" font-weight="700">$1.20</text>
  <text x="40" y="344" font-size="18" fill="#4b5563" text-anchor="start">Each panel uses its own scale. Sol to Luna is 25x on both input ($5 vs $0.20) and output ($30 vs $1.20).</text>
</svg>
