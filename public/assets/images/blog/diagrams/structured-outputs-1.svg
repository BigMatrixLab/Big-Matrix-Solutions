<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="500" fill="#ffffff" rx="16" stroke="#e5e7eb"/>
  <title id="t">From schema to trusted data</title>
  <desc id="d">Five stages: define one schema, generate with constrained decoding in strict mode, check the stop reason for refusal or max tokens, validate types and business rules, then accept, retry with the error, or escalate.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <text x="600" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">From schema to trusted data</text>

  <g font-size="18" fill="#4b5563" text-anchor="middle">
    <rect x="24" y="100" width="208" height="210" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="128" y="142" font-size="22" font-weight="700" fill="#111827">Schema</text>
    <text x="128" y="190">one source</text>
    <text x="128" y="220">of truth</text>
    <text x="128" y="250">Pydantic, Zod</text>

    <rect x="260" y="100" width="208" height="210" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="364" y="142" font-size="22" font-weight="700" fill="#111827">Constrained</text>
    <text x="364" y="170" font-size="22" font-weight="700" fill="#111827">decoding</text>
    <text x="364" y="220">strict mode</text>
    <text x="364" y="250">valid shape</text>

    <rect x="496" y="100" width="208" height="210" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="600" y="142" font-size="22" font-weight="700" fill="#111827">Stop reason</text>
    <text x="600" y="190">refusal?</text>
    <text x="600" y="220">max_tokens?</text>
    <text x="600" y="250">may not match</text>

    <rect x="732" y="100" width="208" height="210" rx="12" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="836" y="142" font-size="22" font-weight="700" fill="#111827">Validate</text>
    <text x="836" y="190">parse to types</text>
    <text x="836" y="220">business rules</text>
    <text x="836" y="250">cross-field checks</text>

    <rect x="968" y="100" width="208" height="210" rx="12" fill="#ffffff" stroke="#ec362e" stroke-width="3"/>
    <text x="1072" y="142" font-size="22" font-weight="700" fill="#ec362e">Decide</text>
    <text x="1072" y="190">accept</text>
    <text x="1072" y="220">retry with error</text>
    <text x="1072" y="250">escalate</text>
  </g>
  <g stroke="#4b5563" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="234" y1="205" x2="256" y2="205"/>
    <line x1="470" y1="205" x2="492" y2="205"/>
    <line x1="706" y1="205" x2="728" y2="205"/>
    <line x1="942" y1="205" x2="964" y2="205"/>
  </g>

  <rect x="260" y="340" width="208" height="8" rx="4" fill="#2563eb"/>
  <text x="364" y="380" text-anchor="middle" font-size="18" fill="#2563eb">provider</text>
  <rect x="496" y="340" width="680" height="8" rx="4" fill="#ec362e"/>
  <text x="836" y="380" text-anchor="middle" font-size="18" fill="#ec362e">your code</text>
  <text x="600" y="450" text-anchor="middle" font-size="20" fill="#111827">Constrained decoding guarantees the shape. It does not guarantee the values.</text>
</svg>
