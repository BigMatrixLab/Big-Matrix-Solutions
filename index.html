  <!-- Preloader Critical CSS -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
    }

    body:not(.loaded) {
      overflow: hidden !important;
    }

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      /* Matches --bm-grid / --bm-grid-size. Inlined because this paints before
         the stylesheets load. */
      background-image: radial-gradient(#d6d6ce 1px, transparent 1.5px);
      background-size: 22px 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
    }
  </style>
</head>

<body>
  <!-- Preloader -->
    <div id="preloader">
    <div class="bm-loader">
