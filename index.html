  <!-- Preloader Critical CSS -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
    }

    /* Prevent scrolling only while preloader is active */
    body:not(.loaded) {
      overflow: hidden !important;
    }

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .loader-content {
      width: 150px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader-content img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    body.loaded #preloader {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>

<body>
  <!-- Preloader -->
  <div id="preloader">
    <div class="loader-content">
      <img src="/assets/images/Loading_Animation.gif" alt="Loading..." />
    </div>
  </div>

  <div id="root"></div>
  
  <script type="module" src="/src/main.jsx"></script>
</body>
