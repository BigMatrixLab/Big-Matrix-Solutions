<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="56x56" href="/assets/images/big_matrix_cube.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Search Console ownership. Keep it: removing it unverifies the site. -->
  <meta name="google-site-verification" content="8NOrAHDZvm9B_wWFYn39lpUs1LXrDZqwg8z2cnEnDY8" />
  <title>Big-Matrix Solutions</title>
  <!--
    Title, description and canonical are set per route by src/components/Seo.jsx.
    They are deliberately absent here: a static canonical would point every URL
    at the homepage, and a static description would duplicate Helmet's.
    Googlebot renders JavaScript, so per-page tags are seen.
  -->

  <!--
    Social preview (Open Graph + Twitter Card).

    These live in the static HTML on purpose. Facebook, LinkedIn, Slack,
    WhatsApp, Discord and X do not execute JavaScript when they scrape a URL, so
    tags rendered by react-helmet-async are invisible to them. Every shared
    address therefore falls back to this site-level card.

    URLs must be absolute — a relative og:image is ignored.
    og-cover.png is 1200x630 (1.91:1), the size every platform crops to. It is
    generated from bm_new_logo.png by scripts/make-og-cover.ps1 — rerun that
    script after changing the logo.
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Big-Matrix Solutions" />
  <meta property="og:url" content="https://big-matrix.com/" />
  <meta property="og:title" content="Big-Matrix Solutions — AI systems for healthcare and industry" />
  <meta property="og:description"
    content="We build advanced software ecosystems: AI-powered medical diagnostics, hospital systems, industrial automation and predictive analytics." />
  <meta property="og:image" content="https://big-matrix.com/assets/images/og-cover.png" />
  <meta property="og:image:secure_url" content="https://big-matrix.com/assets/images/og-cover.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Big-Matrix Solutions logo" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://big-matrix.com/" />
  <meta name="twitter:title" content="Big-Matrix Solutions — AI systems for healthcare and industry" />
  <meta name="twitter:description"
    content="We build advanced software ecosystems: AI-powered medical diagnostics, hospital systems, industrial automation and predictive analytics." />
  <meta name="twitter:image" content="https://big-matrix.com/assets/images/og-cover.png" />
  <meta name="twitter:image:alt" content="Big-Matrix Solutions logo" />

  <!-- Kept in sync with the active theme by ThemeProvider. -->
  <meta name="theme-color" content="#ffffff" />

  <!--
    Theme bootstrap. Runs before any stylesheet is applied so the very first
    paint is already in the right theme — without it, a dark-mode visitor gets
    a white flash while the bundle loads.

    Must stay in agreement with src/context/ThemeContext.jsx: same storage key,
    same attribute names, same allowed values. ThemeProvider reads whatever
    this script wrote, so the first React render does not contradict the page.
  -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bm-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        // Storage blocked or matchMedia missing: the stylesheets default to light.
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- External CSS -->
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/owl.carousel.min.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/animate.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/animated-text.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/all.min.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/theme-default.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/meanmenu.min.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/owl.transitions.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/venobox/venobox.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/assets/css/bootstrap-icons.css" type="text/css" media="all" />
  <link rel="stylesheet" href="/src/assets/css/preloader.css" type="text/css" media="all" />

  <!-- Preloader Critical CSS -->
  <style>
    /* Theme-aware first paint. These literals duplicate --bm-bg and
       --bm-line-strong from bm-tokens.css on purpose: this rule has to apply
       before any stylesheet has loaded, so it cannot reference the tokens.
       Keep the two in sync when the canvas colours change. */
    html {
      --preload-bg: #ffffff;
      --preload-dot: #d4d4d4;
    }

    html[data-theme='dark'] {
      --preload-bg: #0f1011;
      --preload-dot: #202327;
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--preload-bg);
    }

    body:not(.loaded) {
      overflow: hidden !important;
    }

    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: var(--preload-bg);
      /* Matches --bm-grid / --bm-grid-size. Inlined because this paints before
         the stylesheets load. */
      background-image: radial-gradient(var(--preload-dot) 1px, transparent 1.5px);
      background-size: 22px 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
    }
  </style>
</head>

<body>
  <!-- Preloader -->
    <div id="preloader">
    <div class="bm-loader">
      <div class="box box0"><div></div></div>
      <div class="box box1"><div></div></div>
      <div class="box box2"><div></div></div>
      <div class="box box3"><div></div></div>
      <div class="box box4"><div></div></div>
      <div class="box box5"><div></div></div>
      <div class="box box6"><div></div></div>
      <div class="box box7"><div></div></div>
      <div class="ground"><div></div></div>
    </div>
  </div>

  <div id="root"></div>
  
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
